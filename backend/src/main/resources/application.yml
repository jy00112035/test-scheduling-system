server:
  port: 8080

spring:
  application:
    name: test-scheduling-backend

  datasource:
    url: jdbc:h2:file:./data/testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false
      path: /h2-console

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    # V3.1 was added after V4 was released; existing V4 histories must remain valid.
    ignore-migration-patterns:
      - "*:ignored"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:DevSecretKeyForLocalTestingOnlyMustBe32CharsLong}
  expiration: 86400000

logging:
  level:
    com.testscheduling: INFO
    org.hibernate.SQL: DEBUG
